<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Horizon – Study Timer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#020207;--acc:#ffc46b;--vio:#7b93d6;--ink:#efe9ff;--dim:#8d88ab;--line:rgba(200,212,240,.18);--glass:rgba(190,205,240,.08);--f:"Unbounded","Arial Black",sans-serif;--b:"Space Grotesk","Helvetica Neue",Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input{font-family:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 6%,#1a0c38 0,#07040f 38%,var(--bg) 75%);color:var(--ink);font-family:var(--b);overflow-x:hidden}
.sr{position:fixed;border-radius:50%;background:#fff;pointer-events:none;z-index:0;animation:tw ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:100vh}
.fire{font-family:var(--f);font-weight:500;background:linear-gradient(180deg,#fff 0,#fff1d2 55%,#ffd48a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 3px 3px rgba(0,0,0,.95)) drop-shadow(0 0 16px rgba(0,0,0,.95)) drop-shadow(0 0 30px rgba(255,190,100,.3))}
#pill{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);width:min(440px,100%);padding:5px;border-radius:999px;background:rgba(10,6,24,.7);border:1px solid var(--line);backdrop-filter:blur(8px)}
#pill button{position:relative;z-index:1;background:none;border:0;color:var(--dim);font-family:var(--f);font-weight:500;font-size:.78rem;padding:12px 0;cursor:pointer;transition:color .3s}
#pill button.on{color:#1b1205}
#ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:999px;background:linear-gradient(135deg,#ffe2a8,#e0a04c);box-shadow:0 0 24px rgba(255,196,107,.45);transition:transform .45s cubic-bezier(.6,-.2,.2,1.2)}
#strip{position:relative;z-index:2;display:flex;gap:6px;width:100%;overflow-x:auto;padding:2px 2px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.st{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-radius:14px 14px 0 0;background:rgba(10,6,24,.6);border:1px solid var(--line);border-bottom:0;color:var(--dim);cursor:pointer;white-space:nowrap;max-width:230px;font-size:.92rem;font-weight:500}
.st.on{background:linear-gradient(180deg,rgba(123,147,214,.26),rgba(123,147,214,.05));color:#fff;border-color:rgba(200,212,240,.5);box-shadow:0 -6px 20px -8px rgba(123,147,214,.8)}
.st span{overflow:hidden;text-overflow:ellipsis;outline:none;min-width:12px}
.st span[contenteditable=true]{border-bottom:1.5px solid var(--acc);text-overflow:clip;color:#fff}
.st b{font-weight:400;opacity:.5;padding:0 6px;font-size:1.1rem}
.st b:hover{opacity:1;color:#ff6b6b}
.pen{display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:none;color:var(--dim);cursor:pointer}
.pen:hover{color:var(--acc);background:var(--glass)}.st.on .pen{color:var(--acc)}
#add{flex:none;width:36px;background:none;border:1px dashed rgba(200,212,240,.4);border-radius:12px;color:var(--acc);font-size:1.3rem;cursor:pointer;align-self:center}
#add:hover{background:var(--glass)}
#stage{position:relative;width:100%;flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:10px}
.pn{position:relative;z-index:1;display:none;width:100%;flex-direction:column;align-items:center;gap:18px;animation:pin .4s}
.pn.on{display:flex}
@keyframes pin{from{opacity:0;transform:translateX(24px)}}
.big{font-size:clamp(1.9rem,8.5vw,4.6rem);line-height:1.25;white-space:nowrap;padding:6px 10px}
.big i{display:inline-block;font-style:normal;text-align:center}
.big .d{width:.8em}.big .q{width:.42em}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.b{font-family:var(--f);font-weight:500;font-size:.85rem;padding:14px 30px;border-radius:999px;border:1px solid var(--line);background:rgba(10,6,24,.6);color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .2s}
.b:hover{box-shadow:0 0 20px rgba(123,147,214,.5)}.b:active{transform:scale(.95)}
.b.main{color:#1b1205;background:linear-gradient(135deg,#ffe2a8,#e0a04c);border-color:transparent;min-width:130px;box-shadow:0 0 24px rgba(255,196,107,.35)}
.chip{font-size:.85rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer}
.chip:hover,.chip.on{color:#fff;border-color:rgba(200,212,240,.6)}
#mst{position:relative;z-index:1}#mst.on{background:rgba(123,147,214,.2)}
body[data-t="2"] #mst{display:none}
ul{list-style:none;margin:0;padding:0;width:min(420px,100%);max-height:230px;overflow-y:auto}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;color:#d8d0f2}
li small{color:var(--dim);font-size:.85rem}
.empty{color:var(--dim);justify-content:center;font-size:.9rem;border:0}
input{font-size:1rem;background:rgba(5,3,14,.7);color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#tin input{width:76px;text-align:center;font-family:var(--f);font-size:1.1rem}
#tin label{color:var(--dim);font-size:.85rem;display:flex;align-items:center;gap:6px}
#lbl{width:160px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1.2rem}.x:hover{color:#ff6b6b}
.tg{font-size:.8rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);padding:4px 12px;cursor:pointer}
.tg.on{color:#1a0a00;background:var(--acc);border-color:transparent}
#quote{position:relative;z-index:1;width:100%;padding:20px 58px 20px 24px;border-radius:18px;background:linear-gradient(120deg,rgba(123,147,214,.16),rgba(8,5,20,.7));border:1px solid rgba(200,212,240,.28);box-shadow:0 0 34px -12px rgba(123,147,214,.8),inset 3px 0 0 var(--acc)}
#qt{font-family:var(--b);font-weight:500;font-size:clamp(1.05rem,3.4vw,1.35rem);line-height:1.45;color:#f1ecff;transition:opacity .5s;margin:0}
#qn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--acc);cursor:pointer;font-size:1.1rem}
#qn:hover{background:var(--glass)}
#ring{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:rgba(2,1,8,.94);text-align:center;padding:20px}
#ring.on{display:flex}
#ring h2{font-size:clamp(1.8rem,7vw,3.4rem);margin:0}
#ring p{margin:0;color:#d8d0f2;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body data-t="0"><div id="bg"></div>
<main>
  <nav id="pill"><i id="ind"></i><button data-t="0">Stopwatch</button><button data-t="1">Timer</button><button data-t="2">Alarm</button></nav>

  <section id="stage">
    <div class="pn" id="p0">
      <div id="swd" class="fire big"></div>
      <div class="row"><button class="b main" id="sgo">Start</button><button class="b" id="slap">Lap</button><button class="b" id="srs">Reset</button></div>
      <ul id="laps"></ul>
    </div>
    <div class="pn" id="p1">
      <div id="tmd" class="fire big"></div>
      <div class="row pick" id="tin"><div class="col"><div class="wh" id="wh"></div>hours</div><div class="col"><div class="wh" id="wm"></div>min</div><div class="col"><div class="wh" id="ws"></div>sec</div></div>
      <div class="row" id="pre"><button class="chip" data-m="5">5 min</button><button class="chip" data-m="15">15 min</button><button class="chip" data-m="25">25 min</button><button class="chip" data-m="50">50 min</button></div>

<div id="ring"><h2 class="fire">Time’s up</h2><p id="rmsg"></p><button class="b main" id="rok">Dismiss</button></div>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const Q=["Nobody is coming to save your grades. Open the book.","Motivation is a mood. Discipline is a decision. Decide.","The exam doesn’t care how you felt today.","Be uncomfortable now, or be average forever.","Discipline costs ounces. Regret costs tons.","Time is a black hole: what you don’t use, it swallows.","Scrolling has never built anyone’s future.","You can’t negotiate with a deadline.","Cry if you need to. Then get back to the desk.","Quit today and you’ll fight the same battle tomorrow, weaker.","Talent is common. Showing up for the boring hours is rare.","The gap between who you are and who you want to be is the work you’re avoiding.","Excuses sound great to you and to nobody else.","Someone with your dream is studying right now. Beat them.","Comfort is just a slow way of losing.","You don’t need more time. You need fewer distractions.","Average is what happens when you stop at tired.","Your future self is begging you to put the phone down."];
let S,qi=-1;
const mk=n=>({id:Date.now()+Math.random(),name:n,sw:{acc:0,st:0,laps:[]},tm:{dur:1500000,left:1500000,end:0},al:[]});
try{S=JSON.parse(localStorage.getItem('ember'))}catch(e){}
if(!S||!S.sessions||!S.sessions.length)S={sessions:[mk('Session 1')],a:0,tab:0,ms:false};
const save=()=>{try{localStorage.setItem('ember',JSON.stringify(S))}catch(e){}sched()};
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
let st;function sched(){const L=LN();if(!L)return;clearTimeout(st);st=setTimeout(async()=>{try{const p=await L.getPending();if(p.notifications.length)await L.cancel(p);
 const now=new Date(),list=[];let id=1;
 S.sessions.forEach(s=>{if(s.tm.end>Date.now())list.push({id:id++,title:s.name,body:'Timer finished',schedule:{at:new Date(s.tm.end),allowWhileIdle:true}});
  s.al.forEach(a=>{if(!a.on)return;const d=new Date();d.setHours(+a.t.slice(0,2),+a.t.slice(3,5),0,0);if(d<=now)d.setDate(d.getDate()+1);list.push({id:id++,title:s.name,body:(a.label||'Alarm')+' · '+a.t,schedule:{at:d,allowWhileIdle:true}})})});
 if(list.length)await L.schedule({notifications:list})}catch(e){}},300)}
const cur=()=>S.sessions[S.a];
function fmt(t,ms){t=Math.max(0,t);const h=Math.floor(t/36e5),m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;return(h?p2(h)+':':'')+p2(m)+':'+p2(s)+(ms?'.'+String(Math.floor(t%1e3)).padStart(3,'0'):'')}
function setD(el,str){if(el._s===str)return;el._s=str;el.innerHTML=[...str].map(c=>`<i class="${/\d/.test(c)?'d':/[A-Z]/.test(c)?'a':'q'}">${c}</i>`).join('')}
const tmLeft=(t,n)=>t.end?t.end-n:t.left;
/* audio + ring */
let ac,rt;
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18)}catch(e){}}
function ring(m){try{if(window.Notification&&Notification.permission=='granted'&&document.hidden)new Notification('Event Horizon',{body:m})}catch(e){}$('#rmsg').textContent=m;$('#ring').classList.add('on');clearInterval(rt);beep();rt=setInterval(beep,650)}
$('#rok').onclick=()=>{$('#ring').classList.remove('on');clearInterval(rt)};
document.addEventListener('pointerdown',()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}try{window.Notification&&Notification.permission=='default'&&Notification.requestPermission()}catch(e){}},{once:true});
/* render */
const PEN='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function strip(){const el=$('#strip');el.innerHTML='';S.sessions.forEach((s,i)=>{const d=document.createElement('div');d.className='st'+(i==S.a?' on':'');const n=document.createElement('span');n.textContent=s.name;
 const done=()=>{if(n.contentEditable!='true')return;n.contentEditable='false';s.name=n.textContent.trim().slice(0,24)||s.name;n.textContent=s.name;save()};
 const edit=()=>{n.contentEditable='true';n.focus();getSelection().selectAllChildren(n)};
 n.onblur=done;n.onclick=e=>{if(n.isContentEditable)e.stopPropagation()};n.ondblclick=e=>{e.stopPropagation();edit()};
 n.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();n.blur()}if(e.key=='Escape'){n.textContent=s.name;n.blur()}};
 const pen=document.createElement('button');pen.className='pen';pen.title='Rename session';pen.setAttribute('aria-label','Rename session');pen.innerHTML=PEN;pen.onclick=e=>{e.stopPropagation();edit()};
 d.append(n,pen);
 if(S.sessions.length>1){const x=document.createElement('b');x.textContent='×';x.title='Close session';x.onclick=e=>{e.stopPropagation();S.sessions.splice(i,1);S.a=Math.min(S.a>i?S.a-1:S.a,S.sessions.length-1);save();render()};d.append(x)}
 d.onclick=()=>{if(S.a!=i){S.a=i;save();render()}};
 el.append(d)});
 const a=document.createElement('button');a.id='add';a.textContent='+';a.title='New session';a.onclick=()=>{S.sessions.push(mk('Session '+(S.sessions.length+1)));S.a=S.sessions.length-1;save();render();$('#strip').scrollLeft=1e5};el.append(a)}
function laps(){const c=cur(),u=$('#laps');u.innerHTML=c.sw.laps.length?'':'<li class="empty">Press Lap to mark a checkpoint in this session.</li>';c.sw.laps.forEach(l=>{const li=document.createElement('li');li.innerHTML=`<small>Lap ${l.n}</small><b>${fmt(l.split,S.ms)}</b><small>${fmt(l.total,S.ms)}</small>`;u.append(li)})}
function alarms(){const c=cur(),u=$('#als');u.innerHTML=c.al.length?'':'<li class="empty">No alarms in this session yet.</li>';[...c.al].sort((a,b)=>a.t<b.t?-1:1).forEach(a=>{const li=document.createElement('li');li.innerHTML=`<b class="fire" style="font-family:var(--f);font-size:1.05rem"></b><small></small>`;li.children[0].textContent=fmtT(a.t);li.children[1].textContent=a.label;
 const tg=document.createElement('button');tg.className='tg'+(a.on?' on':'');tg.textContent=a.on?'On':'Off';tg.onclick=()=>{a.on=!a.on;save();alarms()};
 const x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=()=>{c.al=c.al.filter(z=>z!==a);save();alarms()};
 const r=document.createElement('span');r.append(tg,x);li.append(r);u.append(li)})}
function wheel(id,items,idx,fn){const w=$(id),k=items.length+items[0];
 if(w._k!==k){w._k=k;w._i=-1;w.innerHTML='';items.forEach((t,i)=>{const d=document.createElement('div');d.textContent=t;d.onclick=()=>w.scrollTo({top:i*44,behavior:'smooth'});w.append(d)});
  let tm;w.onscroll=()=>{const i=Math.max(0,Math.min(items.length-1,Math.round(w.scrollTop/44)));if(w._i!==i){w._i=i;[...w.children].forEach((c,j)=>c.classList.toggle('sel',j==i))}clearTimeout(tm);tm=setTimeout(()=>w._f(i),120)}}
 w._f=fn;if(Math.round(w.scrollTop/44)!=idx)w.scrollTop=idx*44;w._i=idx;[...w.children].forEach((c,j)=>c.classList.toggle('sel',j==idx))}
const rg=n=>[...Array(n).keys()];
function syncT(){const d=Math.round(cur().tm.dur/1000),f=()=>setDur(($('#wh')._i*3600+$('#wm')._i*60+$('#ws')._i)*1000);
 wheel('#wh',rg(24).map(p2),Math.floor(d/3600),f);wheel('#wm',rg(60).map(p2),Math.floor(d/60)%60,f);wheel('#ws',rg(60).map(p2),d%60,f)}
function syncA(){const a=S.at||(S.at={h:7,m:0});$('#cap').style.display=S.h12?'flex':'none';
 if(S.h12){wheel('#ah',rg(12).map(i=>p2(i+1)),(a.h%12||12)-1,i=>{a.h=((i+1)%12)+(a.h>=12?12:0);save()});wheel('#ap',['AM','PM'],a.h>=12?1:0,i=>{a.h=(a.h%12)+(i?12:0);save()})}
 else wheel('#ah',rg(24).map(p2),a.h,i=>{a.h=i;save()});
 wheel('#am',rg(60).map(p2),a.m,i=>{a.m=i;save()})}
const fmtT=t=>{if(!S.h12)return t;const h=+t.slice(0,2);return (h%12||12)+t.slice(2)+(h<12?' AM':' PM')};
function render(){const c=cur(),t=S.tab;document.body.dataset.t=t;
 $('#ind').style.transform=`translateX(${t*100}%)`;document.querySelectorAll('#pill button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 [0,1,2].forEach(i=>$('#p'+i).classList.toggle('on',i==t));
 strip();laps();alarms();
 $('#mst').textContent='Milliseconds: '+(S.ms?'on':'off');$('#mst').classList.toggle('on',S.ms);
 $('#sgo').textContent=c.sw.st?'Stop':'Start';
 const run=!!c.tm.end;$('#tgo').textContent=run?'Pause':'Start';$('#tin').style.display=$('#pre').style.display=run?'none':'flex';
 $('#hfm').textContent='Format: '+(S.h12?'12-hour':'24-hour');if(t==1&&!run)syncT();if(t==2)syncA();
 c.sw._x=0;['#swd','#tmd','#ald'].forEach(s=>$(s)._s=null);tick()}
function tick(){const n=Date.now(),c=cur();
 if(S.tab==0)setD($('#swd'),fmt(c.sw.acc+(c.sw.st?n-c.sw.st:0),S.ms));
 if(S.tab==1){let l=tmLeft(c.tm,n);setD($('#tmd'),fmt(S.ms?l:Math.ceil(l/1000)*1000,S.ms))}
 if(S.tab==2){const d=new Date();let h=d.getHours(),x='';if(S.h12){x=' '+(h<12?'AM':'PM');h=h%12||12}setD($('#ald'),p2(h)+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+x)}
 const d=new Date(),hm=p2(d.getHours())+':'+p2(d.getMinutes());let ch=0;
 S.sessions.forEach(s=>{if(s.tm.end&&n>=s.tm.end){s.tm.end=0;s.tm.left=s.tm.dur;ch=1;ring(s.name+': timer finished')}
  s.al.forEach(a=>{if(a.on&&a.t==hm&&d.getSeconds()<30){a.on=false;ch=1;ring(s.name+': '+(a.label||'alarm')+' ('+a.t+')')}})});
 if(ch){save();render()}}
setInterval(tick,50);
/* events */
document.querySelectorAll('#pill button').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.t;save();render()});
$('#mst').onclick=()=>{S.ms=!S.ms;save();render()};
$('#sgo').onclick=()=>{const w=cur().sw,n=Date.now();if(w.st){w.acc+=n-w.st;w.st=0}else w.st=n;save();render()};
$('#slap').onclick=()=>{const w=cur().sw,n=Date.now(),tot=w.acc+(w.st?n-w.st:0);if(!tot)return;const pv=w.laps.length?w.laps[0].total:0;w.laps.unshift({n:w.laps.length+1,split:tot-pv,total:tot});save();laps()};
$('#srs').onclick=()=>{const w=cur().sw;w.acc=0;w.st=0;w.laps=[];save();render()};
$('#tgo').onclick=()=>{const t=cur().tm,n=Date.now();if(t.end){t.left=t.end-n;t.end=0}else{if(t.left<=0)t.left=t.dur;if(t.left>0)t.end=n+t.left}save();render()};
$('#trs').onclick=()=>{const t=cur().tm;t.end=0;t.left=t.dur;save();render()};
function setDur(ms){const t=cur().tm;if(t.end)return;t.dur=t.left=Math.max(0,ms);save();render()}
$('#hfm').onclick=()=>{S.h12=!S.h12;save();render()};
document.querySelectorAll('#pre .chip').forEach(b=>b.onclick=()=>setDur(b.dataset.m*60000));
$('#aadd').onclick=()=>{const a=S.at||{h:7,m:0},t=p2(a.h)+':'+p2(a.m);cur().al.push({id:Date.now(),t,label:$('#lbl').value.trim(),on:true});$('#lbl').value='';save();alarms()};
function quote(){const q=$('#qt');q.style.opacity=0;setTimeout(()=>{let i;do{i=Math.floor(Math.random()*Q.length)}while(i==qi);qi=i;q.textContent='“'+Q[i]+'”';q.style.opacity=1},300)}
$('#qn').onclick=()=>{quote();clearInterval(qa);qa=setInterval(quote,15000)};
let qa=setInterval(quote,15000);quote();
for(let i=0;i<45;i++){const e=document.createElement('div'),s=Math.random()*2+.6;e.className='sr';e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;opacity:${.3+Math.random()*.7};animation-duration:${2+Math.random()*5}s;animation-delay:${-Math.random()*6}s`;document.body.append(e)}
if(LN())LN().requestPermissions().catch(()=>{});render();sched();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
